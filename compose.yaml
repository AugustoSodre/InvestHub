# Fixed project name: without it, `docker compose` in a git worktree starts a
# second project named after the folder, which fights over port 55432.
name: investhub

services:
  db:
    # Keep in sync with POSTGRES_IMAGE in test/setup/postgres-global.ts.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: investhub
      POSTGRES_PASSWORD: investhub
      POSTGRES_DB: investhub
    ports:
      # Localhost only. 55432 avoids clashing with a Postgres already on 5432.
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Creates the investhub_dev database next to investhub. Postgres runs these
      # only when the volume is new; see the README for an existing volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U investhub -d investhub"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
