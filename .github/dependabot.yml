version: 2
updates:
  # pnpm projects use the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # Workflows plus the local composite action, which pins its own actions.
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
